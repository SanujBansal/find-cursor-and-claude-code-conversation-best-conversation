name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native ARM build — fastest for Apple Silicon
          - target: aarch64-apple-darwin
            runner: macos-14
          # Native Intel build — fastest for x86_64
          - target: x86_64-apple-darwin
            runner: macos-13

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Code signing (optional) ────────────────────────────────────────
          # Uncomment and add these secrets to your repo to produce a
          # notarized, Gatekeeper-approved DMG. Without them the app still
          # works — users just need to run the one-time fix below.
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vibe Score ${{ github.ref_name }}"
          releaseBody: |
            ## What's new

            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Install

            1. Download `Vibe.Score_*_aarch64.dmg` (Apple Silicon) or `Vibe.Score_*_x64.dmg` (Intel).
            2. Open the DMG and drag **Vibe Score** into Applications.
            3. If macOS says the app is "damaged", open Terminal and run:
               ```
               xattr -cr /Applications/Vibe\ Score.app
               codesign --force --deep --sign - /Applications/Vibe\ Score.app
               ```
               Then launch the app normally.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Ad-hoc sign the app bundle
        run: |
          APP=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" | head -1)
          echo "Signing: $APP"
          codesign --force --deep --sign - "$APP"
